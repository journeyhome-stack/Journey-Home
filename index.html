<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journey Home | Every journey leads somewhere. Yours leads home.</title>
    <meta
      name="description"
      content="Explore an ancient island, recover five lost fragments, solve environmental puzzles, and find your way back home in Journey Home, a stylized 3D third-person adventure."
    />
    <meta name="theme-color" content="#0b101b" />

    <!-- Canonical URL placeholder: replace href with your deployed GitHub Pages or custom domain URL -->
    <!-- <link rel="canonical" href="https://YOUR-USERNAME.github.io/YOUR-REPO/" /> -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Journey Home" />
    <meta property="og:title" content="Journey Home | Every journey leads somewhere. Yours leads home." />
    <meta
      property="og:description"
      content="Explore an ancient island across five distinct regions, solve puzzles, and recover lost fragments in Journey Home."
    />
    <!--
      Social Share Image (1200x630) placeholder:
      Once you add public/og-image.jpg (1200x630), uncomment the two meta tags below and update the URL:
      <meta property="og:image" content="https://YOUR-USERNAME.github.io/YOUR-REPO/og-image.jpg" />
      <meta name="twitter:image" content="https://YOUR-USERNAME.github.io/YOUR-REPO/og-image.jpg" />
    -->

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Journey Home | Every journey leads somewhere. Yours leads home." />
    <meta
      name="twitter:description"
      content="Explore an ancient island across five distinct regions, solve puzzles, and recover lost fragments in Journey Home."
    />

    <!-- Typography: Cinzel (display serif) + Plus Jakarta Sans (clean readable body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (VideoGame) using only confirmed facts -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Journey Home",
        "description": "A stylized 3D third-person adventure game with exploration and puzzle-solving across five ancient island regions.",
        "genre": ["Adventure", "Puzzle", "Exploration"],
        "gamePlatform": ["Web Browser", "Desktop", "Mobile"]
      }
    </script>
  </head>
  <body class="bg-[#0b101b] text-[#efe8d8] antialiased selection:bg-amber-500/30 selection:text-amber-100">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
